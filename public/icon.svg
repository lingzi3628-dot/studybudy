<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Graduation cap -->
  <g transform="translate(0, 20)">
    <!-- Cap top (diamond) -->
    <path d="M 256 140 L 410 200 L 256 260 L 102 200 Z" fill="url(#cap)"/>
    <!-- Cap base (trapezoid under cap top) -->
    <path d="M 170 232 L 342 232 L 342 282 Q 256 332 170 282 Z" fill="#E0E7FF" opacity="0.95"/>
    <!-- Cap button -->
    <circle cx="256" cy="200" r="14" fill="#4F46E5"/>
    <!-- Tassel -->
    <path d="M 256 200 L 256 240 Q 256 252 270 252 L 282 252" stroke="#FBBF24" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="282" cy="262" r="10" fill="#FBBF24"/>
  </g>
  <!-- AI spark (bottom-right) -->
  <g transform="translate(360, 360)">
    <path d="M 40 0 L 50 30 L 80 40 L 50 50 L 40 80 L 30 50 L 0 40 L 30 30 Z" fill="#FBBF24"/>
  </g>
  <!-- Circuit dots (top-left, representing AI/tech) -->
  <g transform="translate(80, 80)" opacity="0.6">
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="5" fill="#FFFFFF"/>
    <circle cx="40" cy="0" r="6" fill="#FFFFFF"/>
  </g>
</svg>
